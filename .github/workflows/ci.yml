name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test "test/*.test.ts"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t uptime-sentinel:ci .
      - name: Smoke test image
        run: |
          cid=$(docker run -d -p 8080:8080 -e DB_PATH=/data/sentinel.db -e ADMIN_TOKEN=ci-smoke-token uptime-sentinel:ci)
          sleep 3
          curl -fsS http://127.0.0.1:8080/healthz
          docker rm -f "$cid"
